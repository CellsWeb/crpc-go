site_name: CellsWeb RPC Go
site_description: High-Performance RPC API Framework for Go, fasthttp, and TypeScript/Node.js
site_author: CellsWeb
site_url: https://cellsweb.github.io/crpc-go/

repo_name: CellsWeb/crpc-go
repo_url: https://github.com/CellsWeb/crpc-go

theme:
  name: material
  language: en
  palette:
    # Palette toggle for dark mode
    - scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Start:
      - Overview: index.md
      - Install & Configure: getting-started.md
      - Release & Migration: migration.md
  - User Guides:
      - Functions & Registration: functions.md
      - Native Schemas: schemas.md
      - Middleware & Context: middlewares.md
      - Custom HTTP Routes: custom-routes.md
      - Node IPC Client: node-ipc.md
      - In-Memory Testing: testing.md
      - Interactive API Docs: interactive-docs.md
      - Deployment: deployment.md
  - Reference:
      - Public Go API: api-reference.md
      - Protocol Overview: architecture.md
      - Benchmarks & Limits: benchmarks.md
  - Contributor Guides:
      - Contributing: contributing.md
      - Development Setup: development.md
      - Source Map & Design: internals/index.md
      - Shared Protocol: internals/protocol.md
      - Request Lifecycle: internals/lifecycle.md
      - Registration, Middleware & Context: internals/registration.md
      - Native Schemas, Call APIs & Errors: internals/validation.md
      - HTTP, Multipart & Uploads: internals/transports.md
      - IPC & Client Lifecycle: internals/ipc.md
      - Embedded Renderer: internals/renderer.md
      - CLI & Scaffolding: internals/tooling.md
      - Testing & Safe Extension: internals/testing.md
      - Release Engineering: internals/releasing.md
  - Community:
      - Security Policy: security.md
      - Code of Conduct: code-of-conduct.md
      - Node Contributor Docs: https://cellsweb.github.io/crpc-node/internals/
